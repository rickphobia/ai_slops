<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawn Swarm</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #15120e;
        color: #efe6d4;
        font-family: system-ui, sans-serif;
      }
      :root {
        /* The board is 20 × 14 squares; leave room above it for the HUD. */
        --board-width: min(94vw, calc((94vh - 72px) * 20 / 14));
      }
      #board {
        width: var(--board-width);
        aspect-ratio: 20 / 14;
        border-radius: 4px;
        box-shadow:
          0 0 0 1px #3b3226,
          0 20px 60px rgb(0 0 0 / 50%);
      }
      #hud {
        width: var(--board-width);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
      }
      #hud-status {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 20px;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #a99b81;
      }
      #hud-status strong {
        margin-left: 6px;
        font-size: 1.75rem;
        letter-spacing: 0;
        color: #efe6d4;
        font-variant-numeric: tabular-nums;
      }
      #hud-status #hud-pawns {
        display: inline-block;
        font-size: 2.6rem;
        color: #e8b04a;
      }
      #hud-pawns.bump {
        animation: bump 0.25s ease-out;
      }
      @keyframes bump {
        50% {
          transform: scale(1.18);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #hud-pawns.bump {
          animation: none;
        }
      }
      #battle-controls,
      #speed-buttons {
        display: flex;
        gap: 6px;
      }
      #battle-controls button {
        min-width: 3.5rem;
        padding: 6px 10px;
        border: 1px solid #3b3226;
        border-radius: 6px;
        background: #211c15;
        color: #efe6d4;
        font-size: 1rem;
        cursor: pointer;
      }
      #battle-controls button[aria-pressed="true"] {
        border-color: #e8b04a;
        background: #e8b04a;
        color: #15120e;
        font-weight: bold;
      }
      #pause {
        min-width: 5.5rem;
      }
      /* Red, not the speed gold, so "paused" doesn't read as a fifth speed. */
      #battle-controls #pause[aria-pressed="true"] {
        border-color: #e0614f;
        background: #e0614f;
        color: #15120e;
      }
      #end-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: rgb(0 0 0 / 60%);
      }
      #end-screen[hidden] {
        display: none;
      }
      #end-screen h2 {
        margin: 0;
        font-size: 2.5rem;
      }
      #new-run {
        margin-top: 8px;
        padding: 10px 24px;
        border: none;
        border-radius: 6px;
        background: #e8b04a;
        color: #15120e;
        font-size: 1.25rem;
        font-weight: bold;
        cursor: pointer;
      }
      #startup-error {
        max-width: 40rem;
        padding: 12px 16px;
        border: 1px solid #e06c6c;
        border-radius: 6px;
        background: #4a2020;
      }
    </style>
  </head>
  <body>
    <p id="startup-error" role="alert" hidden></p>
    <header id="hud">
      <p id="hud-status">
        <span>Pawns <strong id="hud-pawns"></strong></span>
        <span>Wave <strong id="hud-wave"></strong></span>
        <span>Black left <strong id="hud-black-left"></strong></span>
        <span>Seed <strong id="hud-seed"></strong></span>
      </p>
      <div id="battle-controls">
        <button id="pause" type="button" aria-pressed="false">Pause</button>
        <div id="speed-buttons" role="group" aria-label="Battle speed"></div>
      </div>
    </header>
    <canvas id="board" aria-label="Chess board"></canvas>
    <section id="end-screen" role="dialog" aria-labelledby="end-title" hidden>
      <h2 id="end-title"></h2>
      <p id="end-detail"></p>
      <button id="new-run" type="button">New run</button>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
