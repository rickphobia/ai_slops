<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawn Swarm</title>
    <link rel="stylesheet" href="/src/fonts.css" />
    <style>
      /* Grotesque dark fantasy (docs/art/README.md): near-black, bone text, blood for what matters. */
      :root {
        color-scheme: dark;
        --bg: #0b0908;
        --panel: #181311;
        --panel-raised: #211915;
        --line: #3a2c22;
        --fg: #e6dccb;
        --muted: #9a8a75;
        --bone: #e9e0cc;
        --blood: #8e1b1b;
        --blood-bright: #c4302a;
        --ember: #ff8a3c;
        --font-display: "Cinzel", Georgia, serif;
        --font-body: "Crimson Pro", Georgia, serif;
        /* The board is 16 × 11 squares; leave room above it for the HUD. */
        --board-width: min(94vw, calc((94vh - 72px) * 16 / 11));
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: radial-gradient(
          ellipse at 50% 0%,
          #1d1512 0%,
          var(--bg) 60%
        );
        background-color: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
        font-size: 17px;
      }
      #board {
        width: var(--board-width);
        aspect-ratio: 16 / 11;
        border-radius: 3px;
        box-shadow:
          0 0 0 1px var(--line),
          0 0 0 4px #120d0b,
          0 0 0 5px #2a1d17,
          0 24px 70px rgb(0 0 0 / 70%);
      }
      #hud {
        width: var(--board-width);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
      }
      #hud-status {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 22px;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #hud-status strong {
        margin-left: 6px;
        font-family: var(--font-display);
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--fg);
        font-variant-numeric: tabular-nums lining-nums;
      }
      #hud-status #hud-pawns {
        display: inline-block;
        font-size: 2.6rem;
        font-weight: 800;
        color: var(--bone);
        text-shadow: 0 0 18px rgb(196 48 42 / 55%);
      }
      #hud-pawns.bump {
        animation: bump 0.25s ease-out;
      }
      @keyframes bump {
        50% {
          transform: scale(1.18);
          color: #fff;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #hud-pawns.bump {
          animation: none;
        }
      }
      #battle-controls,
      #speed-buttons {
        display: flex;
        gap: 6px;
      }
      #battle-controls button {
        min-width: 3.5rem;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--panel);
        color: var(--fg);
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
      }
      #battle-controls button:hover {
        border-color: var(--muted);
        background: var(--panel-raised);
      }
      #battle-controls button:focus-visible,
      #new-run:focus-visible {
        outline: 2px solid var(--bone);
        outline-offset: 2px;
      }
      #battle-controls button[aria-pressed="true"] {
        border-color: var(--blood-bright);
        background: var(--blood);
        color: var(--bone);
      }
      #pause {
        min-width: 5.5rem;
      }
      /* Ember, not the speed red, so "paused" doesn't read as a fifth speed. */
      #battle-controls #pause[aria-pressed="true"] {
        border-color: var(--ember);
        background: var(--ember);
        color: var(--bg);
      }
      #end-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: radial-gradient(
          ellipse at 50% 50%,
          rgb(20 8 6 / 72%) 0%,
          rgb(0 0 0 / 88%) 75%
        );
        text-align: center;
      }
      #end-screen[hidden] {
        display: none;
      }
      #end-screen h2 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: clamp(2.4rem, 6vw, 4rem);
        letter-spacing: 0.04em;
        color: var(--bone);
        text-shadow: 0 0 30px rgb(196 48 42 / 60%);
      }
      #end-screen p {
        margin: 0;
        font-size: 1.2rem;
        color: var(--muted);
      }
      #new-run {
        margin-top: 12px;
        padding: 10px 28px;
        border: 1px solid var(--blood-bright);
        border-radius: 3px;
        background: var(--blood);
        color: var(--bone);
        font-family: var(--font-display);
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      #new-run:hover {
        background: var(--blood-bright);
      }
      #startup-error {
        max-width: 40rem;
        padding: 12px 16px;
        border: 1px solid var(--blood-bright);
        border-radius: 3px;
        background: #2a0c0a;
      }
    </style>
  </head>
  <body>
    <p id="startup-error" role="alert" hidden></p>
    <header id="hud">
      <p id="hud-status">
        <span>Pawns <strong id="hud-pawns"></strong></span>
        <span>Wave <strong id="hud-wave"></strong></span>
        <span>Black left <strong id="hud-black-left"></strong></span>
        <span>Seed <strong id="hud-seed"></strong></span>
      </p>
      <div id="battle-controls">
        <button id="pause" type="button" aria-pressed="false">Pause</button>
        <div id="speed-buttons" role="group" aria-label="Battle speed"></div>
      </div>
    </header>
    <canvas id="board" aria-label="Chess board"></canvas>
    <section id="end-screen" role="dialog" aria-labelledby="end-title" hidden>
      <h2 id="end-title"></h2>
      <p id="end-detail"></p>
      <button id="new-run" type="button">New run</button>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
