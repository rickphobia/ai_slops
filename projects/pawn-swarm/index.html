<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawn Swarm</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #302e2b;
        color: #f0f0f0;
        font-family: system-ui, sans-serif;
      }
      :root {
        /* Leaves room above the board for the HUD. */
        --board-size: min(90vw, calc(90vh - 56px));
      }
      #board {
        width: var(--board-size);
        height: var(--board-size);
      }
      #hud {
        width: var(--board-size);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
      }
      #hud-status {
        margin: 0;
        display: flex;
        gap: 16px;
        font-size: 1.1rem;
      }
      #hud-status strong {
        font-variant-numeric: tabular-nums;
      }
      #battle-controls,
      #speed-buttons {
        display: flex;
        gap: 6px;
      }
      #battle-controls button {
        min-width: 3.5rem;
        padding: 6px 10px;
        border: 1px solid #5c5a57;
        border-radius: 6px;
        background: #3d3b38;
        color: #f0f0f0;
        font-size: 1rem;
        cursor: pointer;
      }
      #battle-controls button[aria-pressed="true"] {
        border-color: #81b64c;
        background: #81b64c;
        color: #ffffff;
        font-weight: bold;
      }
      #pause {
        min-width: 5.5rem;
      }
      #end-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: rgb(0 0 0 / 60%);
      }
      #end-screen[hidden] {
        display: none;
      }
      #end-screen h2 {
        margin: 0;
        font-size: 2.5rem;
      }
      #new-run {
        margin-top: 8px;
        padding: 10px 24px;
        border: none;
        border-radius: 6px;
        background: #81b64c;
        color: #ffffff;
        font-size: 1.25rem;
        font-weight: bold;
        cursor: pointer;
      }
      #startup-error {
        max-width: 40rem;
        padding: 12px 16px;
        border: 1px solid #e06c6c;
        border-radius: 6px;
        background: #4a2020;
      }
    </style>
  </head>
  <body>
    <p id="startup-error" role="alert" hidden></p>
    <header id="hud">
      <p id="hud-status">
        <span>Wave <strong id="hud-wave"></strong></span>
        <span>Pawns <strong id="hud-pawns"></strong></span>
        <span>Seed <strong id="hud-seed"></strong></span>
      </p>
      <div id="battle-controls">
        <button id="pause" type="button" aria-pressed="false">Pause</button>
        <div id="speed-buttons" role="group" aria-label="Battle speed"></div>
      </div>
    </header>
    <canvas id="board" aria-label="Chess board"></canvas>
    <section id="end-screen" role="dialog" aria-labelledby="end-title" hidden>
      <h2 id="end-title"></h2>
      <p id="end-detail"></p>
      <button id="new-run" type="button">New run</button>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
