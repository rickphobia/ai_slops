<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawn Swarm</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #302e2b;
        color: #f0f0f0;
        font-family: system-ui, sans-serif;
      }
      #board {
        width: min(90vw, 90vh);
        height: min(90vw, 90vh);
      }
      #startup-error {
        max-width: 40rem;
        padding: 12px 16px;
        border: 1px solid #e06c6c;
        border-radius: 6px;
        background: #4a2020;
      }
    </style>
  </head>
  <body>
    <p id="startup-error" role="alert" hidden></p>
    <canvas id="board" aria-label="Chess board"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
