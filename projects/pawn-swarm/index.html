<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawn Swarm</title>
    <link rel="stylesheet" href="/src/fonts.css" />
    <style>
      /* Grotesque dark fantasy (docs/art/README.md): near-black, bone text, blood for what matters. */
      :root {
        color-scheme: dark;
        --bg: #0b0908;
        --panel: #181311;
        --panel-raised: #211915;
        --line: #3a2c22;
        --fg: #e6dccb;
        --muted: #9a8a75;
        --bone: #e9e0cc;
        --blood: #8e1b1b;
        --blood-bright: #c4302a;
        --ember: #ff8a3c;
        /* Shop rarities: common uses --muted. */
        --rare: #6fb0ff;
        --epic: #c58bff;
        --black-edge: #4a1a16;
        --font-display: "Cinzel", Georgia, serif;
        --font-body: "Crimson Pro", Georgia, serif;
        /* The board is 16 × 11 squares; leave room above it for the HUD and below it for the skill bar. */
        --board-width: min(94vw, calc((94vh - 150px) * 16 / 11));
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: radial-gradient(
          ellipse at 50% 0%,
          #1d1512 0%,
          var(--bg) 60%
        );
        background-color: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
        font-size: 17px;
      }
      #board {
        width: var(--board-width);
        aspect-ratio: 16 / 11;
        border-radius: 3px;
        box-shadow:
          0 0 0 1px var(--line),
          0 0 0 4px #120d0b,
          0 0 0 5px #2a1d17,
          0 24px 70px rgb(0 0 0 / 70%);
      }
      #hud {
        width: var(--board-width);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
      }
      #hud-status {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 22px;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #hud-status strong {
        margin-left: 6px;
        font-family: var(--font-display);
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--fg);
        font-variant-numeric: tabular-nums lining-nums;
      }
      #hud-status #hud-pawns {
        display: inline-block;
        font-size: 2.6rem;
        font-weight: 800;
        color: var(--bone);
        text-shadow: 0 0 18px rgb(196 48 42 / 55%);
      }
      #hud-pawns.bump {
        animation: bump 0.25s ease-out;
      }
      @keyframes bump {
        50% {
          transform: scale(1.18);
          color: #fff;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #hud-pawns.bump {
          animation: none;
        }
      }
      #battle-controls,
      #speed-buttons {
        display: flex;
        gap: 6px;
      }
      #battle-controls button {
        min-width: 3.5rem;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--panel);
        color: var(--fg);
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
      }
      #battle-controls button:hover {
        border-color: var(--muted);
        background: var(--panel-raised);
      }
      #battle-controls button:focus-visible,
      #new-run:focus-visible {
        outline: 2px solid var(--bone);
        outline-offset: 2px;
      }
      #battle-controls button[aria-pressed="true"] {
        border-color: var(--blood-bright);
        background: var(--blood);
        color: var(--bone);
      }
      #pause {
        min-width: 5.5rem;
      }
      /* Ember, not the speed red, so "paused" doesn't read as a fifth speed. */
      #battle-controls #pause[aria-pressed="true"] {
        border-color: var(--ember);
        background: var(--ember);
        color: var(--bg);
      }
      #skills {
        width: var(--board-width);
        min-height: 54px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }
      #skills[hidden] {
        visibility: hidden;
      }
      .skill {
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 10rem;
        padding: 4px 30px 6px 4px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: linear-gradient(var(--panel-raised), var(--panel));
        color: var(--fg);
        font-family: var(--font-body);
        text-align: left;
        cursor: pointer;
      }
      .skill:hover:not(:disabled) {
        border-color: var(--muted);
      }
      .skill:focus-visible {
        outline: 2px solid var(--bone);
        outline-offset: 2px;
      }
      .skill[data-state="ready"] {
        border-color: var(--blood-bright);
        box-shadow: 0 0 12px
          color-mix(in srgb, var(--blood-bright) 35%, transparent);
      }
      .skill[data-state="queued"] {
        border-color: var(--ember);
      }
      .skill:disabled {
        cursor: default;
      }
      .skill[data-state="cooldown"] .skill-icon,
      .skill[data-state="cooldown"] .skill-name {
        opacity: 0.5;
      }
      /* The drawings leave room around the piece; let it spill into the padding. */
      .skill-icon svg {
        display: block;
        width: 48px;
        height: 48px;
        margin: -6px -4px -4px;
      }
      .skill-words {
        display: flex;
        flex-direction: column;
      }
      .skill-name {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--bone);
      }
      .skill-status {
        font-size: 0.85rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .skill[data-state="queued"] .skill-status {
        color: var(--ember);
      }
      .skill-hotkey {
        position: absolute;
        top: 4px;
        right: 6px;
        min-width: 1.1em;
        padding: 0 3px;
        border: 1px solid var(--line);
        border-radius: 2px;
        font-family: var(--font-display);
        font-size: 0.75rem;
        text-align: center;
        color: var(--muted);
      }
      /* Fills from left to right as the cooldown runs out. */
      .skill-recharge {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background: var(--blood-bright);
        transform-origin: left;
      }
      .skill[data-state="ready"] .skill-recharge {
        background: var(--ember);
      }
      /* A short message over the top of the board: power-ups, new pushes. It never takes clicks. */
      #toast {
        position: fixed;
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        max-width: 90vw;
        margin: 0;
        padding: 6px 18px;
        border: 1px solid var(--toast-colour, var(--line));
        border-radius: 3px;
        background: rgb(11 9 8 / 88%);
        color: var(--toast-colour, var(--bone));
        font-family: var(--font-display);
        font-weight: 600;
        letter-spacing: 0.06em;
        text-align: center;
        pointer-events: none;
        z-index: 5;
      }
      #toast[hidden] {
        display: none;
      }
      #end-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: radial-gradient(
          ellipse at 50% 50%,
          rgb(20 8 6 / 72%) 0%,
          rgb(0 0 0 / 88%) 75%
        );
        text-align: center;
      }
      #end-screen[hidden] {
        display: none;
      }
      #end-screen h2 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: clamp(2.4rem, 6vw, 4rem);
        letter-spacing: 0.04em;
        color: var(--bone);
        text-shadow: 0 0 30px rgb(196 48 42 / 60%);
      }
      #end-screen p {
        margin: 0;
        font-size: 1.2rem;
        color: var(--muted);
      }
      #new-run {
        margin-top: 12px;
        padding: 10px 28px;
        border: 1px solid var(--blood-bright);
        border-radius: 3px;
        background: var(--blood);
        color: var(--bone);
        font-family: var(--font-display);
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      #new-run:hover {
        background: var(--blood-bright);
      }
      #shop {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        padding: 24px 16px;
        box-sizing: border-box;
        background: radial-gradient(
          ellipse at 50% 30%,
          rgb(20 8 6 / 82%) 0%,
          rgb(0 0 0 / 92%) 75%
        );
      }
      #shop[hidden] {
        display: none;
      }
      .shop-sheet {
        max-width: 64rem;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .shop-sheet h2 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: clamp(2rem, 4.5vw, 3rem);
        letter-spacing: 0.04em;
        color: var(--bone);
        text-shadow: 0 0 30px rgb(196 48 42 / 60%);
      }
      .shop-sheet h3 {
        margin: 0 0 8px;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #shop-purse {
        margin: 6px 0 0;
        max-width: 62ch;
        color: var(--muted);
      }
      #shop-purse strong {
        font-family: var(--font-display);
        font-size: 1.4rem;
        color: var(--bone);
      }
      .shop-columns {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
        gap: 12px 24px;
      }
      .chips {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 10px 2px 2px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--panel);
        font-variant-numeric: tabular-nums;
      }
      .chip-black {
        border-color: var(--black-edge);
      }
      #shop-black-types {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #shop-black-types[hidden] {
        display: none;
      }
      .black-types {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr));
        gap: 6px;
      }
      /* Each black type wears its board ring's colour on its edge. */
      .black-type {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 10px 2px 2px;
        border: 1px solid var(--black-edge);
        border-left: 4px solid var(--ring, var(--black-edge));
        border-radius: 3px;
        background: var(--panel);
      }
      .black-type-name {
        font-family: var(--font-display);
        font-weight: 600;
        color: var(--ring, var(--bone));
      }
      .black-type-power {
        display: block;
        color: var(--muted);
        font-size: 0.95rem;
      }
      #shop-met-black-types summary {
        cursor: pointer;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }
      #shop-met-black-types summary:focus-visible {
        outline: 2px solid var(--bone);
        outline-offset: 2px;
      }
      .chip-icon svg {
        display: block;
        width: 34px;
        height: 34px;
      }
      #shop-stats h3 {
        margin-bottom: 4px;
      }
      /* On a phone the table scrolls sideways inside its own box, not the page. */
      .stats-scroll {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--panel);
      }
      #shop-stats-table {
        width: 100%;
        min-width: 22rem;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      #shop-stats-table th,
      #shop-stats-table td {
        padding: 2px 10px;
        text-align: right;
        white-space: nowrap;
      }
      #shop-stats-table th:first-child,
      #shop-stats-table td:first-child {
        text-align: left;
      }
      #shop-stats-table th {
        color: var(--muted);
        font-weight: normal;
        border-bottom: 1px solid var(--line);
      }
      #shop-stats-table tfoot td {
        border-top: 1px solid var(--line);
        font-weight: bold;
      }
      #shop-stats-table .chip-icon {
        display: inline-block;
        vertical-align: middle;
        margin-right: 4px;
      }
      #shop-stats-table .chip-icon svg {
        width: 28px;
        height: 28px;
      }
      #shop-last-wave {
        margin: 6px 0 0;
        color: var(--muted);
      }
      #shop-last-wave strong {
        color: var(--bone);
      }
      #shop-offers {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
        gap: 12px;
      }
      .offer {
        --rarity: var(--muted);
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
        padding: 12px 14px 14px;
        border: 1px solid var(--line);
        border-top: 3px solid var(--rarity);
        border-radius: 3px;
        background: linear-gradient(var(--panel-raised), var(--panel));
      }
      .offer[data-rarity="rare"] {
        --rarity: var(--rare);
      }
      .offer[data-rarity="epic"] {
        --rarity: var(--epic);
      }
      .offer-full {
        opacity: 0.55;
      }
      .offer p {
        margin: 0;
      }
      .offer-portrait {
        align-self: center;
      }
      .offer-portrait svg {
        display: block;
        width: 128px;
        height: 128px;
      }
      .offer-rarity {
        font-family: var(--font-display);
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--rarity);
      }
      .offer .offer-name {
        margin: 0;
        letter-spacing: 0.02em;
        text-transform: none;
        font-family: var(--font-display);
        font-size: 1.3rem;
        font-weight: 600;
      }
      .offer-stats,
      .offer-count,
      .offer-note {
        font-size: 0.95rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .offer-count strong {
        color: var(--fg);
      }
      .offer-note {
        color: var(--ember);
      }
      .offer-skill strong {
        font-family: var(--font-display);
        font-weight: 600;
        color: var(--ember);
      }
      .offer-buttons {
        margin-top: auto;
        padding-top: 8px;
        display: flex;
        gap: 6px;
      }
      .shop-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px;
      }
      .shop-button {
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--panel);
        color: var(--fg);
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .shop-button:hover:not(:disabled) {
        border-color: var(--muted);
        background: var(--panel-raised);
      }
      .shop-button:focus-visible {
        outline: 2px solid var(--bone);
        outline-offset: 2px;
      }
      .shop-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .shop-button-main {
        flex: 1;
        border-color: var(--blood-bright);
        background: var(--blood);
        color: var(--bone);
      }
      .shop-button-main:hover:not(:disabled) {
        border-color: var(--blood-bright);
        background: var(--blood-bright);
      }
      .shop-button[aria-pressed="true"] {
        border-color: var(--ember);
        color: var(--ember);
      }
      #shop-start {
        padding: 10px 28px;
        font-size: 1.15rem;
        letter-spacing: 0.08em;
      }
      #startup-error {
        max-width: 40rem;
        padding: 12px 16px;
        border: 1px solid var(--blood-bright);
        border-radius: 3px;
        background: #2a0c0a;
      }
      #settings-toggle {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 100;
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--panel);
        color: var(--fg);
        font-family: var(--font-display);
        font-weight: 600;
        cursor: pointer;
      }
      #settings-panel {
        position: fixed;
        right: 12px;
        bottom: 56px;
        z-index: 100;
        width: min(18rem, calc(100vw - 24px));
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--panel-raised);
        color: var(--fg);
      }
      #settings-panel[hidden] {
        display: none;
      }
      #settings-panel h2 {
        margin: 0 0 8px;
        font-family: var(--font-display);
        font-size: 1rem;
      }
      #settings-panel label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 6px 0;
      }
      #settings-panel input[type="range"] {
        width: 8rem;
      }
      #settings-toggle:focus-visible,
      #settings-panel input:focus-visible {
        outline: 2px solid var(--bone);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <p id="startup-error" role="alert" hidden></p>
    <header id="hud">
      <p id="hud-status">
        <span>Pawns <strong id="hud-pawns"></strong></span>
        <span>Wave <strong id="hud-wave"></strong></span>
        <span>Black left <strong id="hud-black-left"></strong></span>
        <span>Seed <strong id="hud-seed"></strong></span>
      </p>
      <div id="battle-controls">
        <button id="pause" type="button" aria-pressed="false">Pause</button>
        <div id="speed-buttons" role="group" aria-label="Battle speed"></div>
      </div>
    </header>
    <canvas id="board" aria-label="Chess board"></canvas>
    <nav id="skills" aria-label="Skills" hidden></nav>
    <p id="toast" role="status" hidden></p>
    <section id="shop" role="dialog" aria-labelledby="shop-title" hidden>
      <div class="shop-sheet">
        <header>
          <h2 id="shop-title"></h2>
          <p id="shop-purse"></p>
        </header>
        <div class="shop-columns">
          <section aria-labelledby="shop-army-title">
            <h3 id="shop-army-title">Your army</h3>
            <ul id="shop-army" class="chips"></ul>
          </section>
          <section aria-labelledby="shop-next-wave-title">
            <h3>Next: <span id="shop-next-wave-title"></span></h3>
            <ul id="shop-next-wave" class="chips"></ul>
          </section>
        </div>
        <section id="shop-black-types" aria-label="Black types" hidden>
          <div id="shop-new-black-types-box">
            <h3>New black types this wave</h3>
            <ul id="shop-new-black-types" class="black-types"></ul>
          </div>
          <details id="shop-met-black-types">
            <summary id="shop-met-black-types-title"></summary>
            <ul id="shop-met-black-types-list" class="black-types"></ul>
          </details>
        </section>
        <section id="shop-stats" aria-labelledby="shop-stats-title">
          <h3 id="shop-stats-title">Army stats</h3>
          <div class="stats-scroll">
            <table id="shop-stats-table">
              <thead>
                <tr>
                  <th scope="col">Pawn</th>
                  <th scope="col">Count</th>
                  <th scope="col">HP</th>
                  <th scope="col">Attack</th>
                  <th scope="col" title="Attack ÷ seconds between strikes">
                    Dmg/s
                  </th>
                </tr>
              </thead>
              <tbody id="shop-stats-rows"></tbody>
              <tfoot id="shop-stats-totals"></tfoot>
            </table>
          </div>
          <p id="shop-last-wave"></p>
        </section>
        <div id="shop-offers"></div>
        <footer class="shop-bar">
          <button
            id="shop-reroll"
            class="shop-button"
            type="button"
            data-action="reroll"
            data-focus-key="reroll"
          ></button>
          <button
            id="shop-start"
            class="shop-button shop-button-main"
            type="button"
            data-action="start-wave"
          ></button>
        </footer>
      </div>
    </section>
    <section id="end-screen" role="dialog" aria-labelledby="end-title" hidden>
      <h2 id="end-title"></h2>
      <p id="end-detail"></p>
      <button id="new-run" type="button">New run</button>
    </section>
    <button
      id="settings-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="settings-panel"
    >
      Settings
    </button>
    <section id="settings-panel" aria-labelledby="settings-title" hidden>
      <h2 id="settings-title">Settings</h2>
      <label
        >Master volume
        <input id="setting-master" type="range" min="0" max="100" />
      </label>
      <label
        >Music volume
        <input id="setting-music" type="range" min="0" max="100" />
      </label>
      <label
        >Effects volume
        <input id="setting-effects" type="range" min="0" max="100" />
      </label>
      <label
        >Mute all sound
        <input id="setting-muted" type="checkbox" />
      </label>
      <label
        >Screen shake
        <input id="setting-shake" type="checkbox" />
      </label>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
