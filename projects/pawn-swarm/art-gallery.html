<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawn Swarm art gallery</title>
    <link rel="stylesheet" href="/src/fonts.css" />
    <style>
      body {
        margin: 0;
        padding: 24px 16px 48px;
        background: #0b0908;
        color: #e6dccb;
        font-family: "Crimson Pro", Georgia, serif;
        font-size: 17px;
      }
      h1,
      h2 {
        font-family: "Cinzel", Georgia, serif;
        font-weight: 600;
        letter-spacing: 0.06em;
      }
      h2 {
        margin-top: 32px;
        font-size: 15px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #9a8a75;
      }
      p {
        max-width: 70ch;
        color: #9a8a75;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 14px;
        color: #9a8a75;
      }
      .portrait svg {
        width: 132px;
        height: 132px;
        background: #181311;
        border: 1px solid #3a2c22;
      }
    </style>
  </head>
  <body>
    <h1>Pawn Swarm art</h1>
    <p>
      Every drawing, for checking the art. "At game size" uses the game's own
      sprites on the game's board, one square = 48 CSS px. "Portraits" are the
      live SVG the shop shows. Not part of the game build.
    </p>
    <h2>At game size</h2>
    <div class="row" id="game-size"></div>
    <h2>Portraits</h2>
    <div class="row" id="portraits"></div>
    <script type="module" src="/src/art-gallery.ts"></script>
  </body>
</html>
