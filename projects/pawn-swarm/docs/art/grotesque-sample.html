<title>Pawn Swarm Grotesque Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Crimson+Pro:wght@400;600&display=swap">
<style>
/* Layout: one row per piece, the current look beside the grotesque one, so the jump in intensity is easy to judge. Single dark look on purpose. */
:root { color-scheme: dark; --bg: #0b0908; --plinth: #181311; --plinth-2: #211915; --line: #3a2c22; --fg: #e6dccb; --muted: #9a8a75; --blood: #9a1b1b;
  --font-display: "Cinzel", Georgia, serif; --font-body: "Crimson Pro", Georgia, serif; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; }
main { max-width: 900px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 48px; display: flex; flex-direction: column; gap: 22px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 5vw, 42px); margin: 0; text-wrap: balance; }
h1 span { color: var(--blood); }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }
.head, .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 14px; align-items: center; }
.head { font-family: var(--font-display); font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.stage { aspect-ratio: 1; max-width: 100%; border: 1px solid var(--line); border-radius: 3px; display: grid; place-items: center;
  background: radial-gradient(circle at 70% 80%, #4a0c0c66 0 12%, transparent 30%), radial-gradient(ellipse at 50% 50%, transparent 40%, #000d 100%), repeating-conic-gradient(var(--plinth-2) 0 25%, #120e0c 0 50%) 0 0 / 50% 50%; }
.stage svg { width: 86%; height: 86%; filter: drop-shadow(0 6px 6px #000a); }
.row h3 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.row p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.35; }
@media (max-width: 560px) { .head { display: none; } .row { grid-template-columns: 1fr 1fr; } .row > div:last-child { grid-column: 1 / -1; } }
</style>
<main>
  <header>
    <h1>How far can it go? <span>Grotesque</span> test</h1>
    <p class="lede">Left is the approved style. Right pushes it into body horror: flayed skin, exposed muscle and organs, extra eyes and mouths, maggots, pooling blood. Still drawn shapes, not realistic gore. Pick a side, or a point in between.</p>
  </header>
  <div class="head"><span>Now</span><span>Grotesque</span><span></span></div>
  <div id="rows"></div>
</main>
<script>

// Shared parts, drawn in a 100×100 box.
const BONE = "#d9cfb6", BONE_D = "#a8987a", BONE_DD = "#7d6e55", OUT = "#120b08", BLOOD = "#7a1010", BLOOD_L = "#b3201c", ICHOR = "#0b0806";
const IRON = "#221c1a", IRON_L = "#3f3530", EMBER = "#ff6a1f", SICK = "#bfc4a2", FLUSH = "#d9a091";
const outline = `stroke="${OUT}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`;
const at = (cx, s, svg) => `<g transform="translate(${cx} 100) scale(${s}) translate(-50 -100)">${svg}</g>`;

// a hooded, stitched bone figure with hollow eyes; tint changes the skin
function pawnBody(cx = 50, s = 1, tint = BONE, tearSide = -1) {
  return at(cx, s, `
  <path d="M30 92 L34 86 L37 90 L41 85 L45 90 L50 85 L55 90 L59 85 L63 90 L66 86 L70 92 L62 82 Q64 64 58 54 L42 54 Q36 64 38 82 Z" fill="${tint}" ${outline}/>
  <path d="M41 66 Q44 74 42 82 M58 64 Q55 72 57 80" fill="none" stroke="${BONE_DD}" stroke-width="1.6"/>
  <path d="M39 70 L61 69" stroke="#5a4532" stroke-width="2.6"/>
  <path d="M44 69 L46 76 M47 69 L46 75" stroke="#5a4532" stroke-width="1.4"/>
  <circle cx="50" cy="38" r="13.5" fill="${tint}" ${outline}/>
  <path d="M35 42 Q34 20 50 21 Q66 20 65 42 L62 36 L60 41 Q57 29 50 29 Q43 29 40 41 L38 36 Z" fill="${BONE_DD}" ${outline}/>
  <ellipse cx="45" cy="39" rx="3.4" ry="4.2" fill="${ICHOR}"/><ellipse cx="55" cy="39" rx="3.4" ry="4.2" fill="${ICHOR}"/>
  <circle cx="45" cy="40" r="1.1" fill="#ff2a1a"><animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="55" cy="40" r="1.1" fill="#ff2a1a"><animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
  <path d="M44 47 L56 47" stroke="${OUT}" stroke-width="1.6"/>
  <path d="M45.5 45 L46.5 49 M48.5 45 L49.5 49 M51.5 45 L52.5 49 M54.5 45 L55.5 49" stroke="${OUT}" stroke-width="1.1"/>
  <path d="M${50 + tearSide * 5} 43 Q${50 + tearSide * 5.6} 47 ${50 + tearSide * 4.8} 51" fill="none" stroke="${BLOOD_L}" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M56 28 L54 32 L57 34" fill="none" stroke="${OUT}" stroke-width="1.2"/>`);
}
// a hooded stitched head on its own, for the conjoined twins
function twinHead(cx, cy, r, tint, tearSide) {
  const k = r / 13.5;
  return `<g transform="translate(${cx} ${cy}) scale(${k}) translate(-50 -38)">
    <circle cx="50" cy="38" r="13.5" fill="${tint}" ${outline}/>
    <path d="M35 42 Q34 20 50 21 Q66 20 65 42 L62 36 L60 41 Q57 29 50 29 Q43 29 40 41 L38 36 Z" fill="${BONE_DD}" ${outline}/>
    <ellipse cx="45" cy="39" rx="3.4" ry="4.2" fill="${ICHOR}"/><ellipse cx="55" cy="39" rx="3.4" ry="4.2" fill="${ICHOR}"/>
    <circle cx="45" cy="40" r="1.1" fill="#ff2a1a"/><circle cx="55" cy="40" r="1.1" fill="#ff2a1a"/>
    <path d="M44 47 L56 47" stroke="${OUT}" stroke-width="1.6"/>
    <path d="M45.5 45 L46.5 49 M48.5 45 L49.5 49 M51.5 45 L52.5 49 M54.5 45 L55.5 49" stroke="${OUT}" stroke-width="1.1"/>
    <path d="M${50 + tearSide * 5} 43 Q${50 + tearSide * 5.6} 47 ${50 + tearSide * 4.8} 51" fill="none" stroke="${BLOOD_L}" stroke-width="1.6" stroke-linecap="round"/></g>`;
}
const drip = (x, y, len, dur) => `<circle cx="${x}" cy="${y}" r="1.5" fill="${BLOOD}"><animate attributeName="cy" values="${y};${y + len};${y}" dur="${dur}s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="${dur}s" repeatCount="indefinite"/></circle>`;
const ART = {
  plain: () => pawnBody(),
  bomb: () => pawnBody(44) + `
    <circle cx="66" cy="72" r="15" fill="#3a2a22" ${outline}/>
    <path d="M53 66 Q66 62 79 67 M52 76 Q66 80 80 75" fill="none" stroke="#1d1410" stroke-width="1.6"/>
    <path d="M58 64 L60 68 M63 63 L64 67 M69 63 L68 67 M74 64 L72 68" stroke="#c9b894" stroke-width="1.2"/>
    <circle cx="66" cy="74" r="5.5" fill="#c9b894"/><circle cx="64" cy="73" r="1.4" fill="#1d1410"/><circle cx="68" cy="73" r="1.4" fill="#1d1410"/>
    <path d="M64 77 L68 77" stroke="#1d1410" stroke-width="1"/>
    <path d="M74 60 Q82 52 78 44" fill="none" stroke="#6b5a45" stroke-width="3" stroke-linecap="round"/>
    <circle cx="78" cy="42" r="4.5" fill="${EMBER}"><animate attributeName="r" values="3;5.5;3" dur=".4s" repeatCount="indefinite"/></circle>
    <circle cx="78" cy="42" r="1.8" fill="#fff3c4"/>
    <path d="M42 73 Q50 78 56 74" fill="none" stroke="${OUT}" stroke-width="2.4" stroke-linecap="round"/>`,
  // conjoined twins, one body and two heads. Twin-to-twin transfusion: the left head is the
  // gaunt, pale donor; the right is swollen and flushed; a vessel pumps between their necks
  twin: () => `
    <path d="M24 92 L28 86 L32 90 L36 85 L41 90 L46 85 L50 90 L54 85 L59 90 L64 85 L68 90 L72 86 L76 92 L68 82 Q71 62 64 52 L36 52 Q29 62 32 82 Z" fill="${BONE}" ${outline}/>
    <path d="M36 66 Q39 74 37 82 M64 64 Q61 72 63 80" fill="none" stroke="${BONE_DD}" stroke-width="1.6"/>
    <path d="M33 70 L67 69" stroke="#5a4532" stroke-width="2.6"/>
    <path d="M44 58 Q50 54 56 58 L54 66 Q50 70 46 66 Z" fill="#9e7a66" ${outline}/>
    <path d="M47 60 Q50 57 53 60 Q50 65 47 60 Z" fill="${BLOOD_L}"><animateTransform attributeName="transform" type="scale" values="1;1.2;1" additive="sum" dur=".7s" repeatCount="indefinite"/></path>
    <path d="M45 61 L43 59 M55 61 L57 59 M50 66 L50 68" stroke="${OUT}" stroke-width="1.1"/>` +
    twinHead(37, 36, 10.5, SICK, 1) + twinHead(63, 34, 14, FLUSH, -1) + `
    <path d="M40 46 C46 54 54 42 58 48" fill="none" stroke="${BLOOD}" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M40 46 C46 54 54 42 58 48" fill="none" stroke="${BLOOD_L}" stroke-width="1.8" stroke-dasharray="2.5 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-15" dur=".7s" repeatCount="indefinite"/></path>`,
  spear: () => `
    <path d="M70 94 L70 24" stroke="#4a3626" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M70 4 L76 22 L70 27 L64 22 Z" fill="#8a9095" ${outline}/>
    <circle cx="70" cy="18" r="6" fill="#efe8d8" ${outline}/><circle cx="71.5" cy="17.5" r="2.6" fill="#7a2a12"/><circle cx="72" cy="17.2" r="1.2" fill="${ICHOR}"/>
    <path d="M65 20 Q62 24 64 27 M75 21 Q78 25 76 28" fill="none" stroke="${BLOOD_L}" stroke-width="1.4"/>
    <path d="M70 26 Q72 40 70 54 Q69 64 71 74" fill="none" stroke="${BLOOD}" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M66 40 L74 42 L72 50 L68 46 Z" fill="#5d4c3f" ${outline}/>` + drip(71, 74, 18, 1.4) + pawnBody(42) + `
    <circle cx="64" cy="64" r="4.5" fill="${BONE}" ${outline}/>`,
  // the shield is stretched skin, stitched together, with an eye that still blinks
  shield: () => pawnBody(38) + `
    <path d="M52 52 L84 50 L84 78 Q84 92 68 97 Q52 92 52 78 Z" fill="#b58f7a" ${outline}/>
    <path d="M60 52 Q66 70 60 94 M76 51 Q72 66 78 90" fill="none" stroke="#7a5a48" stroke-width="1.6"/>
    <path d="M58 60 L62 58 M58 68 L62 67 M58 76 L62 76 M58 84 L61 85" stroke="${OUT}" stroke-width="1.2"/>
    <ellipse cx="69" cy="70" rx="7" ry="4.5" fill="#f2ead8" ${outline}/>
    <circle cx="69" cy="70" r="2.6" fill="#3b1a0e"><animate attributeName="cx" values="67;71;69;67" dur="3s" repeatCount="indefinite"/></circle>
    <path d="M62 70 Q69 63 76 70" fill="#b58f7a" stroke="${OUT}" stroke-width="1.6"><animate attributeName="d" values="M62 70 Q69 63 76 70;M62 70 Q69 63 76 70;M62 70 Q69 76 76 70;M62 70 Q69 63 76 70" keyTimes="0;.9;.95;1" dur="4s" repeatCount="indefinite"/></path>
    <path d="M63 78 Q65 86 63 92" fill="none" stroke="${BLOOD}" stroke-width="1.6"/>
    <circle cx="56" cy="55" r="1.8" fill="#8a9095"/><circle cx="80" cy="54" r="1.8" fill="#8a9095"/>`,
  // a horse skull on an exposed spine, leaking black ichor
  knight: () => `
    <path d="M24 94 L76 94 L72 84 L28 84 Z" fill="${IRON}" ${outline}/>
    <path d="M36 84 L38 60 Q30 50 34 38 Q40 22 56 16 L60 7 L64 16 Q76 22 80 38 L82 54 Q74 60 66 54 L60 58 Q66 68 66 84 Z" fill="#3b312b" ${outline}/>
    <path d="M40 60 L40 82 M46 62 L46 84 M52 62 L52 84 M58 62 L58 84" stroke="${OUT}" stroke-width="2"/>
    <path d="M38 64 L60 64 M38 72 L62 72" stroke="#6b5a4c" stroke-width="2"/>
    <path d="M48 22 Q60 20 70 28" fill="none" stroke="#6b5a4c" stroke-width="2"/>
    <ellipse cx="66" cy="32" rx="5" ry="6" fill="${ICHOR}"/>
    <circle cx="67" cy="33" r="2" fill="${EMBER}"><animate attributeName="opacity" values="1;.4;1" dur="1.1s" repeatCount="indefinite"/></circle>
    <path d="M70 48 L72 52 L74 48 L76 52 L78 48" fill="none" stroke="${OUT}" stroke-width="1.6"/>
    <path d="M78 44 L80 50" stroke="${OUT}" stroke-width="1.6"/>
    <path d="M44 26 Q36 36 38 50" fill="none" stroke="${ICHOR}" stroke-width="3"/>
    <path d="M60 58 Q61 64 60 70" fill="none" stroke="${ICHOR}" stroke-width="2.4"/>` + drip(60, 70, 14, 1.8).replaceAll(BLOOD, ICHOR),
  // a ruined tower with one huge eye in the window and chains hanging off it
  rook: () => `
    <path d="M22 94 L78 94 L74 84 L26 84 Z" fill="${IRON}" ${outline}/>
    <path d="M30 84 L33 36 L67 36 L70 84 Z" fill="${IRON}" ${outline}/>
    <path d="M27 36 L27 18 L36 18 L36 26 L45 26 L45 14 L55 16 L55 26 L63 26 L63 20 L73 18 L73 36 Z" fill="${IRON}" ${outline}/>
    <path d="M42 46 Q50 38 58 46 L58 62 L42 62 Z" fill="#2a0806" ${outline}/>
    <ellipse cx="50" cy="53" rx="7" ry="6" fill="#f0d9b0"/>
    <circle cx="50" cy="53" r="3.5" fill="${EMBER}"><animate attributeName="cx" values="47;53;50;47" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="53" r="1.4" fill="${ICHOR}"><animate attributeName="cx" values="47;53;50;47" dur="3.4s" repeatCount="indefinite"/></circle>
    <path d="M44 48 L42 46 M50 46 L50 43 M56 48 L58 46" stroke="#5a2a1a" stroke-width="1.2"/>
    <path d="M70 40 Q78 48 74 60" fill="none" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="3 2"/>
    <path d="M74 60 Q78 64 74 66" fill="none" stroke="#8a8a8a" stroke-width="2"/>
    <path d="M30 44 Q24 54 28 62" fill="none" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="3 2"/>
    <path d="M36 84 Q38 90 34 94 M62 84 Q60 90 64 94" fill="none" stroke="${BLOOD}" stroke-width="2.4"/>
    <path d="M38 40 L36 56 M62 70 L64 80" stroke="${IRON_L}" stroke-width="2"/>`,

  // a plague priest: mitre that opens into a vertical toothed mouth
  bishop: () => `
    <path d="M24 94 L76 94 L72 84 L28 84 Z" fill="${IRON}" ${outline}/>
    <path d="M32 84 Q34 60 42 50 L58 50 Q66 60 68 84 Z" fill="${IRON}" ${outline}/>
    <path d="M38 52 Q34 30 50 8 Q66 30 62 52 Z" fill="#2c2420" ${outline}/>
    <path d="M50 14 Q46 30 50 46 Q54 30 50 14 Z" fill="#3a0906" stroke="${OUT}" stroke-width="1.4"/>
    <path d="M49 18 L47 20 M51 22 L53 24 M49 27 L47 29 M51 32 L53 34 M49 37 L47 39 M51 41 L53 43" stroke="#e9e0cc" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M44 50 L56 50" stroke="${IRON_L}" stroke-width="3"/>
    <path d="M40 58 Q38 70 40 80 M60 58 Q62 70 60 80" fill="none" stroke="#d8cbb0" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M50 46 Q51 60 49 74" fill="none" stroke="${BLOOD}" stroke-width="2"/>` + drip(49, 74, 10, 1.7),
  // a corpse bride: veil, crown of teeth, reaching hand
  queen: () => `
    <path d="M22 94 L78 94 L74 84 L26 84 Z" fill="${IRON}" ${outline}/>
    <path d="M28 84 Q30 56 40 46 L60 46 Q70 56 72 84 Z" fill="${IRON}" ${outline}/>
    <path d="M30 80 Q34 52 50 30 Q66 52 70 80 Q60 70 50 74 Q40 70 30 80 Z" fill="#9a9086" opacity=".55" ${outline}/>
    <circle cx="50" cy="34" r="10" fill="#c9bfae" ${outline}/>
    <ellipse cx="46" cy="34" rx="2.6" ry="3.2" fill="${ICHOR}"/><ellipse cx="54" cy="34" rx="2.6" ry="3.2" fill="${ICHOR}"/>
    <path d="M46 40 Q50 43 54 40" fill="none" stroke="${OUT}" stroke-width="1.4"/>
    <path d="M39 26 L41 16 L44 24 L47 13 L50 23 L53 13 L56 24 L59 16 L61 26 Z" fill="#e9e0cc" ${outline}/>
    <path d="M40 46 Q44 60 40 70" fill="none" stroke="${BLOOD}" stroke-width="2.4"/>
    <path d="M68 58 L80 52 L86 46 M80 52 L88 52 M80 52 L86 57" fill="none" stroke="#c9bfae" stroke-width="2.4" stroke-linecap="round"/>`,
  // a rotting king: crown fused into the skull, bone cross, eyes opening on the robe
  king: () => `
    <path d="M20 94 L80 94 L76 84 L24 84 Z" fill="${IRON}" ${outline}/>
    <path d="M28 84 Q30 58 38 48 L62 48 Q70 58 72 84 Z" fill="${IRON}" ${outline}/>
    <circle cx="50" cy="36" r="12" fill="#5a4c40" ${outline}/>
    <path d="M37 32 L39 22 L44 28 L50 20 L56 28 L61 22 L63 32 Q50 28 37 32 Z" fill="#7a6a40" ${outline}/>
    <path d="M50 20 L50 6 M45 11 L55 11" stroke="#e9e0cc" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M44 33 L42 30 M56 33 L58 30" stroke="${OUT}" stroke-width="1.2"/>
    <ellipse cx="45" cy="37" rx="3" ry="3.4" fill="${ICHOR}"/><ellipse cx="55" cy="37" rx="3" ry="3.4" fill="${ICHOR}"/>
    <circle cx="45" cy="37.5" r="1.3" fill="${EMBER}"/><circle cx="55" cy="37.5" r="1.3" fill="${EMBER}"/>
    <path d="M44 44 L46 46 L48 44 L50 46 L52 44 L54 46 L56 44" fill="none" stroke="#e9e0cc" stroke-width="1.4"/>
    ${[[40,62],[58,58],[48,72],[62,74],[36,76]].map(([x,y],i)=>`<ellipse cx="${x}" cy="${y}" rx="3.6" ry="2.4" fill="#f0d9b0" ${outline}/><circle cx="${x}" cy="${y}" r="1.3" fill="${BLOOD_L}"><animate attributeName="r" values="1.3;1.3;0;1.3" keyTimes="0;.85;.9;1" dur="${2.5 + i * .4}s" repeatCount="indefinite"/></circle>`).join("")}` + drip(42, 84, 8, 2.1).replaceAll(BLOOD, ICHOR),
};
// black types: the base piece plus one strong change that shows the power
const VAR = {
  stomper: () => ART.knight() + `
    <path d="M30 60 L24 64 L30 66 M32 70 L26 76 L33 76" fill="none" stroke="#8a8a8a" stroke-width="2.4"/>
    <path d="M28 84 L24 92 M50 94 L48 99 M72 84 L78 92" stroke="#ff9a3c" stroke-width="2" stroke-linecap="round"/>
    <path d="M24 94 L76 94 L76 99 L24 99 Z" fill="#4a3f3a" ${outline}/>`,
  hunter: () => ART.knight() + `
    <circle cx="62" cy="28" r="1.8" fill="#ff2a1a"/><circle cx="70" cy="38" r="1.8" fill="#ff2a1a"/>
    <path d="M20 40 L32 38 M18 48 L30 46 M22 56 L32 54" stroke="#ff4f7a" stroke-width="2" stroke-linecap="round" opacity=".7"/>`,
  priest: () => ART.bishop() + `
    <path d="M66 60 L76 70" stroke="#6b6b6b" stroke-width="1.6"/>
    <circle cx="78" cy="73" r="5" fill="#3a3430" ${outline}/>
    <circle cx="80" cy="64" r="5" fill="#8fcf6b" opacity=".4"><animate attributeName="cy" values="68;54" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="76" cy="60" r="4" fill="#8fcf6b" opacity=".3"><animate attributeName="cy" values="66;50" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;0" dur="2.6s" repeatCount="indefinite"/></circle>`,
  sniper: () => `<g transform="translate(50 94) scale(.86 1.08) translate(-50 -94)">${ART.bishop()}</g>` + `
    <path d="M70 90 L84 6" stroke="#e9e0cc" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="57" cy="40" r="3" fill="#6fb0ff"/><circle cx="57" cy="40" r="1.2" fill="${ICHOR}"/>`,
  tower: () => ART.rook() + `
    <path d="M31 50 L69 50 M31 66 L69 66 M30 76 L70 76" stroke="#6f7a85" stroke-width="3"/>
    <path d="M44 46 L44 62 M50 46 L50 62 M56 46 L56 62" stroke="#6f7a85" stroke-width="2.4"/>
    <path d="M27 18 L27 10 L35 10 L35 18 M65 18 L65 10 L73 10 L73 18" fill="${IRON}" ${outline}/>`,
  cannon: () => ART.rook() + `
    <path d="M40 48 L40 60 L62 58 L62 50 Z" fill="#3a3430" ${outline}/>
    <rect x="58" y="47" width="16" height="12" rx="2" fill="#2a2422" ${outline}/>
    <circle cx="74" cy="53" r="4" fill="${ICHOR}"/>
    <circle cx="82" cy="50" r="5" fill="#8a8078" opacity=".5"><animate attributeName="cx" values="78;92" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="1.6s" repeatCount="indefinite"/></circle>`,
  storm: () => ART.queen() + `
    <path d="M38 22 L32 14 L36 14 L28 4 M62 22 L68 12 L64 12 L72 2" fill="none" stroke="#bff3ff" stroke-width="2" stroke-linejoin="round"><animate attributeName="opacity" values="1;.2;1;1" dur=".9s" repeatCount="indefinite"/></path>
    <circle cx="50" cy="60" r="34" fill="none" stroke="#bff3ff" stroke-width="1.2" stroke-dasharray="2 6" opacity=".6"/>`,
  summoner: () => `
    <ellipse cx="50" cy="95" rx="40" ry="6" fill="none" stroke="#c58bff" stroke-width="2"/>
    <path d="M18 95 L82 95 M30 90 L70 100 M30 100 L70 90" stroke="#c58bff" stroke-width="1" opacity=".6"/>` + ART.queen() + `
    <path d="M14 92 Q12 80 18 76 Q24 80 22 92" fill="#c58bff" opacity=".35"><animate attributeName="opacity" values=".1;.5;.1" dur="2s" repeatCount="indefinite"/></path>
    <path d="M80 92 Q78 80 84 76 Q90 80 88 92" fill="#c58bff" opacity=".35"><animate attributeName="opacity" values=".5;.1;.5" dur="2s" repeatCount="indefinite"/></path>`,
};
Object.assign(ART, VAR);
const big = svg => `<g transform="translate(50 98) scale(1.18) translate(-50 -96)">${svg}</g>`;

// ---------- grotesque versions ----------
const MEAT = "#9b2a2a", MEAT_D = "#5e1414", MEAT_L = "#c4524a", FAT = "#e8d3a8", VEIN = "#4a1f3a", BILE = "#9aa83a";
const maggot = (x, y, d) => `<path d="M${x} ${y} q2 -2 4 0 q2 2 4 0" fill="none" stroke="#efe6cf" stroke-width="2.2" stroke-linecap="round"><animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="${d}s" repeatCount="indefinite"/></path>`;

const ROWS = [

  ["twin", "Twin pawn", "The two faces have grown into one swollen head, sharing a third eye where they meet. The pale donor side is collapsing; veins bulge on the other."],
  ["spear", "Spear pawn", "It has run the spear through its own body. Three eyeballs are skewered on the shaft, still looking around."],
  ["knight", "Knight", "A skinned horse head: raw muscle, a lipless grin, eyes blinking open down its neck, ribs breaking out."],
  ["queen", "Queen", "Under the veil her face is a single vertical mouth. Four bony arms twitch, and a second face is on her belly."],
];
document.getElementById("rows").innerHTML = ROWS.map(([id, name, text]) => `<div class="row" style="margin-bottom:14px">
  <div class="stage"><svg viewBox="0 0 100 100">${big(ART[id]())}</svg></div>
  <div class="stage"><svg viewBox="0 0 100 100">${big(GROT[id]())}</svg></div>
  <div><h3>${name}</h3><p>${text}</p></div></div>`).join("");
</script>
