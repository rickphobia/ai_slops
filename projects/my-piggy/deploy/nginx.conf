# pipeline-project: my-piggy

# my-piggy's page and game file (index.html, index.pck) change on every deploy but keep their
# names, so browsers must check with the server each time instead of reusing a stale copy.
# no-cache still allows a cheap 304 when nothing changed. The engine files (index.wasm, index.js)
# change only with the Godot version and keep their normal caching.
#
# A location with its own add_header drops the server block's add_header lines, so the
# cross-origin headers from the homelab's default.conf are repeated here.
#
# Installed as ~/homelab/nginx/projects/my-piggy.conf; see the README's "Deploy" section.
location ~ ^/ai-projects/my-piggy/(index\.(html|pck))?$ {
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy same-origin;
    add_header Cross-Origin-Embedder-Policy credentialless;
    try_files $uri $uri/ =404;
}
