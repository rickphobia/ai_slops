[project]
name = "court-booker"
version = "0.1.0"
description = "Books the badminton Court at 1120 Park Avenue on Picktime when a date opens."
# The Docker image's Python (Playwright's Ubuntu 24.04 image ships 3.12).
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "uvicorn==0.54.0",
]

[project.scripts]
court-booker = "court_booker.cli:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["uv_build==0.9.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
