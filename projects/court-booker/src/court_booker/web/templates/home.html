{% extends "base.html" %}
{% block content %}
  <header>
    <h1>court-booker</h1>
    <form method="post" action="{{ request.url_for('logout').path }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="quiet">Log out</button>
    </form>
  </header>
  <p>You're logged in. Booking Requests will be listed here.</p>
  <p><a href="{{ request.url_for('profile').path }}">Profile</a></p>
{% endblock %}
