<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}court-booker{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --accent: #1d6f42; --error: #b3261e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 32rem; margin: 0 auto; padding: 1.5rem 1rem; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    input { width: 100%; font-size: 1rem; padding: 0.7rem; margin-bottom: 1rem; }
    button { font-size: 1rem; padding: 0.7rem 1.2rem; border: 0; border-radius: 0.4rem;
             background: var(--accent); color: #fff; cursor: pointer; }
    button.quiet { background: transparent; color: inherit; text-decoration: underline; padding: 0; }
    .error { color: var(--error); font-weight: 600; }
    .error.field { margin-top: -0.75rem; }
    .notice { color: var(--accent); font-weight: 600; }
    a.button { display: inline-block; padding: 0.7rem 1.2rem; border-radius: 0.4rem;
               background: var(--accent); color: #fff; text-decoration: none; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .actions form { margin: 0; }
    fieldset.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.5rem, 1fr));
                     gap: 0.5rem; border: 0; padding: 0; margin: 0 0 1rem; }
    fieldset.slots legend { font-weight: 600; margin-bottom: 0.5rem; }
    fieldset.slots label { display: flex; align-items: center; gap: 0.5rem; margin: 0; font-weight: 400;
                           padding: 0.7rem; border: 1px solid currentColor; border-radius: 0.4rem; }
    fieldset.slots input { width: auto; margin: 0; }
    ul.requests { list-style: none; padding: 0; margin: 0; }
    li.request { border: 1px solid currentColor; border-radius: 0.4rem; padding: 0.75rem 1rem;
                 margin-bottom: 0.75rem; }
    li.request h2 { font-size: 1.1rem; margin: 0 0 0.25rem; }
    li.request p { margin: 0 0 0.25rem; }
    li.request .actions { margin: 0.5rem 0 0; }
    li.status-cancelled { opacity: 0.6; }
    li.request .slot-result { margin: 0 0 0.25rem; }
    .slot-booked strong { color: var(--accent); }
    .slot-failed strong, .slot-taken strong { color: var(--error); }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
