name: happy-cotton

on:
  push:
    paths:
      - "projects/happy-cotton/**"
      - ".github/workflows/happy-cotton.yml"
  pull_request:
    paths:
      - "projects/happy-cotton/**"
      - ".github/workflows/happy-cotton.yml"

permissions:
  contents: read

concurrency:
  group: happy-cotton-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/happy-cotton

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/happy-cotton/requirements.txt
      - run: pip install -r requirements.txt
      # Godot and its export templates come from the official release for the version pinned in
      # scripts/godot-pin.env and are checked against the pinned checksums. The cache key holds
      # the pin file's hash, so changing the version downloads the new one.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ hashFiles('projects/happy-cotton/scripts/godot-pin.env') }}
      - run: scripts/setup-godot.sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Format check, lint, type check (headless import, warnings are errors) and tests.
      # The steps live in scripts/check.sh so you can run the same thing locally.
      - run: GDTOOLKIT_BIN="$(dirname "$(command -v gdlint)")" scripts/check.sh
      # Prove the web export still builds.
      - run: mkdir -p build/web && godot --headless --export-release Web build/web/index.html
      - run: test -s build/web/index.html && test -s build/web/index.wasm && test -s build/web/index.pck
      # The custom shell (web/shell.html) is in use: loading bar and the no-WebGL 2 message.
      - run: grep -q "Loading Happy Cotton" build/web/index.html
      - run: shellcheck -x -P SCRIPTDIR scripts/*.sh deploy/*.sh
